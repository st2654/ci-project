# ci-fix configuration example.
# Copy this file to config.toml (gitignored) and adjust the values.
# Secrets are NOT read from this file. Set them as environment variables:
#   export ANTHROPIC_API_KEY=...
#   export GITHUB_TOKEN=...      # needs repo + pull request write access

[ci_fix]
# Anthropic model used by the fixer agent.
model = "claude-sonnet-4-6"
# Sampling temperature (0.0 to 1.0); 0.0 = as deterministic as possible.
# Newer models (claude-sonnet-5-5, claude-opus-5-5) reject temperature: use
#   model = "claude-sonnet-5-5"
#   temperature = "default"     # don't send a temperature
temperature = 0.0
# Fix -> re-test rounds per failing test before it is reported as unfixable.
max_attempts = 3
# Maximum number of fixes run in parallel.
max_parallel_workers = 4
# Directory where repositories are cloned and worktrees are created (~ is expanded).
workspace_dir = "~/.ci-fix/workspaces"
# Prefix for the patch branch; the PR number is appended.
branch_prefix = "ci-fix/pr-"
# Extra arguments passed to pytest when running the target tests.
pytest_args = []
# Command for the full regression suite, run only when source files changed.
regression_command = ["pytest"]
# Python version for the test environment when the target repo has no .python-version file.
python_version = "3.11"
# Optional custom dependency install command, run in the repo with the test venv active.
# When unset, ci-fix detects uv.lock, pyproject.toml/setup.py, or requirements files.
# install_command = ["uv", "pip", "install", "-e", ".[test]"]
# Timeout in seconds for each environment setup command and each pytest run.
test_timeout_seconds = 900
# Keep the run directory (clone, venv, JUnit reports) after the run, for debugging.
keep_workspace = false
# Fixer agent: maximum model turns (tool-call rounds) per fix attempt.
max_agent_steps = 30
# Fixer agent: maximum tokens the model may generate per turn.
max_output_tokens = 4096
# Fixer agent: the PR diff shown to the model is truncated to this many characters.
pr_diff_max_chars = 40000
# Fixer agent: maximum lines returned by one read_file call.
read_max_lines = 400
# Console log level: DEBUG, INFO, WARNING or ERROR. INFO shows pipeline progress.
log_level = "INFO"
# Optional file that receives full DEBUG logs for troubleshooting (~ is expanded).
# log_file = "~/.ci-fix/ci-fix.log"
